name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: lint + test (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest

  database-boundary:
    name: PostgreSQL access boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: medsync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Test schema, server access, and denied client access
        env:
          PGPASSWORD: local-ci-only
        run: psql -h localhost -U postgres -d medsync_test -v ON_ERROR_STOP=1 -f tests/sql/server_access.sql
